name: Bilibili UP Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "发送一条微信测试消息"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Bilibili
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          if [ "${{ github.event.inputs.test_push }}" = "true" ]; then
            python3 - <<'PY'
          import os, json, urllib.request
          content = "🔔 B站 UP主监控测试消息\n\n如果你能看到这条消息，说明 GitHub Actions → WxPusher → 微信 的推送链路正常。"
          payload = json.dumps({
              "content": content,
              "summary": "B站 UP主监控测试",
              "contentType": 1,
              "spt": os.environ["WXPUSHER_SPT"],
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://wxpusher.zjiecode.com/api/send/message/simple-push",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              result = json.loads(r.read())
          print(result)
          if not result.get("success", False):
              raise RuntimeError(result)
          PY
          else
            python3 bilibili-monitor/monitor.py
          fi

      - name: Save state
        run: |
          if git diff --quiet -- bilibili-monitor/state.json; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bilibili-monitor/state.json
          git commit -m "chore: update bilibili monitor state"
          git push
